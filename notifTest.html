<!DOCTYPE html>
<html lang="en">
<head>
    <title>Test</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .checkboxes{
            margin-top: 100px;
            margin-bottom: 100px;
            display: flex;
            flex-direction: row;
        }
        .holder{
            margin-right: 50px;
        }
        .boxTitle{
            color: white;
            font-size: 30px;
            margin-left: 5px;
        }
        button{
            font-size: 100px;
            padding: 10px;
        }
        .notifText{
            font-size: 30px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div id="notif"></div>

    <div class="checkboxes">
        <div class="holder" style="display: flex;" id="holder" onclick="changeType()">
            <input type="radio" id="normal" class="box" name="type">
            <p class="boxTitle">Normal</p>
        </div>
        <div class="holder" style="display: flex;" id="holder" onclick="changeType()">
            <input type="radio" id="red" class="box" name="type">
            <p class="boxTitle" style="color: red;">Red</p>
        </div>
        <div class="holder" style="display: flex;" id="holder" onclick="changeType()">
            <input type="radio" id="green" class="box" name="type">
            <p class="boxTitle" style="color: green;">Green</p>
        </div>
    </div>
    <textarea class="notifText" id="textArea"></textarea>
    <button onclick="loadNotif()">Spawn</button>
</body>
<script>
    var typeChecked = false;
    var choosenType = "none";
    // <div class="notifHolder">
    //     <input type="image" src="pics/main/notif/x.webp" width="50px" class="xButton">
    //     <div class="notif">
    //         <img src="pics/main/notif/normal.webp" height="50px">
    //         <p class="notifText">Notification</p>
    //         <div class="timeLine"></div>
    //     </div>
    //  </div>

    function changeType() {
        const radio = event.currentTarget.querySelector('input[type="radio"]');
        radio.checked = true;
        typeChecked = true;
        choosenType = radio.id;
    }


    function loadNotif() {
        if (typeChecked) {
            var cclass = "notif";
            var text = document.getElementById("textArea").value;
            var target = document.getElementById("notif");
            if (choosenType == "normal") {
                cclass = "notif";
            }
            else if (choosenType == "red") {
                cclass = "notifError";
            }

            const newDiv = document.createElement('div');
            newDiv.className = 'notifHolder';
            newDiv.innerHTML = `
            <input type="image" src="pics/main/notif/x.webp" width="50px" class="xButton">
            <div class="${cclass}">
                <img src="pics/main/notif/normal.webp" height="50px">
                <p class="notifText">${text}</p>
                <div class="timeLine"></div>
            </div>
            `;

            target.insertAdjacentElement('afterend', newDiv);
        }
        else{
            alert("please choose type")
        }
}

</script>
</html>
